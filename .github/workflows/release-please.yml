name: Release Please

# Automated releases:
#  1. Every merge to main updates (or opens) a "Release PR" that accumulates
#     conventional commits into a version bump + CHANGELOG entry.
#  2. Merging that Release PR creates the GitHub release/tag, which triggers the
#     publish job below: full verify gate, then npm publish with provenance.
#
# Requirements:
#  - NPM_TOKEN repository secret (npm granular automation token).
#  - Optional RELEASE_PLEASE_TOKEN (a PAT). Without it the Release PR is opened
#    by GITHUB_TOKEN, and GitHub does not run CI checks on such PRs; the publish
#    job's verify gate still protects the release itself.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm --provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      # prepublishOnly runs the full gate: format, lint, typecheck, coverage, build.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
